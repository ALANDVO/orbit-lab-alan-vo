[build-system]
requires = ["setuptools==69.5.1"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "orbit-lab"
version = "1.0.0"
description = "Orbit Lab: AI orchestrator for a fleet of coding agents"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Alan Vo", email = "alanvo@gmail.com"}]

[project.urls]
Homepage = "https://github.com/ALANDVO/orbit-lab-alan-vo"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100